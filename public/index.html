<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Card Generator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 10h19" stroke="currentColor" stroke-width="2"/><path d="M6 15h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="logo-text">Virtual Card Generator</span>
        <span id="mode-badge" class="badge hidden">MODE DEMO</span>
      </div>
      <div class="topbar-actions">
      <button id="bell" class="btn ghost bell" type="button" title="Notifikasi transaksi ditolak">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.9 1.9 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Notifikasi</span>
        <span id="bell-count" class="bell-count hidden">0</span>
      </button>
      <button id="refresh" class="btn ghost" type="button" title="Muat ulang daftar kartu">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Muat ulang</span>
      </button>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="no-key" class="banner hidden">
      <strong>API key belum diisi.</strong> Salin <code>.env.example</code> ke <code>.env</code>, isi <code>KRIPICARD_API_KEY</code>, lalu jalankan ulang <code>start.bat</code>.
    </div>

    <section class="stats" aria-label="Ringkasan">
      <div class="stat"><span class="stat-label">Total kartu</span><span class="stat-value" id="stat-total">–</span></div>
      <div class="stat"><span class="stat-label">Aktif</span><span class="stat-value" id="stat-active">–</span></div>
      <div class="stat"><span class="stat-label">Dibekukan</span><span class="stat-value" id="stat-frozen">–</span></div>
      <div class="stat"><span class="stat-label">Total saldo kartu</span><span class="stat-value" id="stat-balance">–</span></div>
    </section>

    <main class="layout">
      <aside class="panel create-panel">
        <h2>Buat kartu baru</h2>
        <form id="create-form" autocomplete="off">
          <label class="field">
            <span class="field-label">BIN</span>
            <select name="bin" id="bin" required></select>
          </label>

          <div class="field">
            <label class="field-label" for="create-amount">Saldo awal (USD)</label>
            <div class="money-input">
              <span>$</span>
              <input name="amount" id="create-amount" type="number" min="10" step="0.01" value="250" required>
            </div>
            <div class="chips" id="amount-chips"></div>
          </div>

          <label class="field">
            <span class="field-label">Nama di kartu</span>
            <input name="name_on_card" minlength="2" maxlength="50" required placeholder="mis. Budi Santoso">
          </label>

          <label class="field">
            <span class="field-label">Email <span class="muted">· opsional</span></span>
            <input name="email" type="email" placeholder="default: email akun">
          </label>

          <label class="field hidden" id="dob-field">
            <span class="field-label">Tanggal lahir <span class="muted">· wajib untuk BIN ini</span></span>
            <input name="dateOfBirth" type="date">
          </label>

          <dl class="summary" id="create-summary"></dl>

          <button class="btn primary block" type="submit">Buat kartu</button>
        </form>
      </aside>

      <section class="cards-section">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Cari nama, 4 digit terakhir, atau ID kartu">
          </div>
          <div class="segmented" id="status-filter" role="tablist">
            <button type="button" data-filter="all" class="active">Semua</button>
            <button type="button" data-filter="active">Aktif</button>
            <button type="button" data-filter="frozen">Beku</button>
          </div>
        </div>

        <div id="cards" class="cards"></div>
        <div id="empty" class="empty hidden">
          <p class="empty-title" id="empty-title">Belum ada kartu</p>
          <p class="muted" id="empty-text">Kartu yang kamu buat akan muncul di sini.</p>
        </div>
      </section>
    </main>
  </div>

  <dialog id="dialog">
    <form method="dialog" class="dialog-body">
      <h3 id="dialog-title"></h3>
      <div id="dialog-content"></div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/app.js"></script>
</body>
</html>
